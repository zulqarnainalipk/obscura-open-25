[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obscura-open25"
version = "1.0.0"
description = "Tools for reading OBSCURA-Open-25: Sentinel-2 chips paired with Sentinel-5P targets at 25 industrial facilities"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Zulqarnain Ali", email = "zulqar445ali@gmail.com" }]
keywords = ["Earth observation", "Sentinel-2", "Sentinel-5P", "methane", "dataset"]
dependencies = ["numpy>=1.24", "pandas>=2.0", "rasterio>=1.3"]

[project.optional-dependencies]
notebook = ["matplotlib>=3.7", "scikit-learn>=1.3", "jupyter"]
test = ["pytest>=7"]

[project.urls]
Dataset = "https://doi.org/[ZENODO DOI]"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
